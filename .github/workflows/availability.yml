name: Production availability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public readiness
        run: curl --fail --silent --show-error --max-time 10 --retry 2 https://stm.approid.team/api/health/ready
