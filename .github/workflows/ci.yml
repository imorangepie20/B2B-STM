name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: b2b_stm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b2b_stm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/b2b_stm_test
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/b2b_stm_test
      APP_ORIGIN: http://127.0.0.1:3101
      API_HOST: 127.0.0.1
      API_PORT: 3200
      ATTACHMENT_SCAN_MODE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration grant roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d b2b_stm_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE b2b_stm_app NOLOGIN" \
            -c "CREATE ROLE b2b_stm_test_app NOLOGIN"

      - name: Apply test migrations
        run: node scripts/migrate.mjs --test

      - name: Build API
        run: npm run build:api

      - name: Run foundation tests
        run: npm run test:foundation

      - name: Build Web
        run: npm run build:web

      - name: Verify public repository
        run: npm run repo:verify-public

      - name: Validate Compose model
        run: docker compose --env-file infra/secrets/compose.env.example -f infra/compose.zorin.yml config --no-env-resolution --no-path-resolution --quiet

      - name: Build deployment images
        run: |
          docker build --file apps/api/Dockerfile --tag b2b-stm-api:ci .
          docker build --file apps/web/Dockerfile --tag b2b-stm-web:ci .
