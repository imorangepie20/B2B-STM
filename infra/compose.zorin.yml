x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    env_file: ./secrets/database.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *default-logging

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks: [backend]
    logging: *default-logging

  api:
    image: b2b-stm-api:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ./secrets/api.env
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend, egress]
    logging: *default-logging

  web:
    image: b2b-stm-web:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_BACKEND_ORIGIN: http://api:3200
    restart: unless-stopped
    env_file: ./secrets/web.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [frontend, backend]
    logging: *default-logging

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    env_file: ./secrets/tunnel.env
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    logging: *default-logging

  migrate:
    image: b2b-stm-api:${APP_VERSION:-local}
    profiles: [tools]
    env_file: ./secrets/migration.env
    command: ["node", "scripts/migrate.mjs", "--development"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging

  demo-seed:
    image: b2b-stm-api:${APP_VERSION:-local}
    profiles: [tools]
    env_file: ./secrets/api.env
    environment:
      DEMO_CREDENTIALS_PATH: /run/b2b-stm-secrets/demo-credentials.json
    command: ["node", "scripts/seed-demo-data.mjs", "--deployment", "--confirm-seed=B2B_STM_DEMO"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./runtime:/run/b2b-stm-secrets
    networks: [backend]
    logging: *default-logging

networks:
  frontend:
    name: b2b-stm-frontend
  backend:
    name: b2b-stm-backend
    internal: true
  egress:
    name: b2b-stm-egress

volumes:
  postgres-data:
    name: b2b-stm-postgres-data
  clamav-data:
    name: b2b-stm-clamav-data
